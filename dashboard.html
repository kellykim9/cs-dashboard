<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS 문의 현황 대시보드</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e3e6ea;
    --text: #1c2430;
    --text-sub: #5b6573;
    --accent: #2b59d9;
    --accent-soft: #a9bdf0;
    --grid: #e3e6ea;
    --good: #14803c;
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c;
      --surface: #1b212a;
      --border: #2b3340;
      --text: #e8ecf1;
      --text-sub: #9aa5b4;
      --accent: #7aa2ff;
      --accent-soft: #3d4f78;
      --grid: #2b3340;
      --good: #5fd18a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 24px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .lead { margin: 0 0 24px; color: var(--text-sub); font-size: 15px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .kpi-label { font-size: 13px; color: var(--text-sub); }
  .kpi-value { font-size: 32px; font-weight: 700; line-height: 1.2; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .kpi-value small { font-size: 16px; font-weight: 600; margin-left: 2px; }
  .kpi-delta { font-size: 12px; color: var(--text-sub); }
  .kpi-delta b { color: var(--good); font-weight: 600; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .card .sub { font-size: 12px; color: var(--text-sub); margin: 0 0 8px; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: var(--font); fill: var(--text); }
  .t-sub { fill: var(--text-sub); }
  .bar-strong { fill: var(--accent); }
  .bar-soft { fill: var(--accent-soft); }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
  .dot-big { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .insight {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 20px;
  }
  .foot { text-align: center; font-size: 12px; color: var(--text-sub); margin: 0; }
  @media (max-width: 720px) {
    .kpis, .charts { grid-template-columns: 1fr; }
    h1 { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>CS 문의 현황 대시보드</h1>
  <p class="lead">최근 8주 문의 추이를 보고, 다음 주에 줄일 문의 유형을 정하기 위한 요약입니다.</p>

  <section class="kpis" id="kpis"></section>

  <section class="charts">
    <div class="card">
      <h2>문의 유형별 건수</h2>
      <p class="sub">8주 합계 · 건수 많은 순 · 상위 2개 강조</p>
      <svg id="chart-types" viewBox="0 0 480 230" role="img" aria-label="문의 유형별 건수 가로 막대 차트"></svg>
    </div>
    <div class="card">
      <h2>주차별 평균 처리시간</h2>
      <p class="sub">단위: 시간 · 최고점과 마지막 주 강조</p>
      <svg id="chart-time" viewBox="0 0 480 230" role="img" aria-label="주차별 평균 처리시간 꺾은선 차트"></svg>
    </div>
  </section>

  <p class="insight" id="insight"></p>
  <p class="foot">샘플 데이터입니다.</p>
</div>

<script>
// ===== 데이터 (이 배열 값만 바꾸면 KPI·차트·인사이트가 다시 계산됩니다) =====
const TYPE_DATA = [
  { label: "결제·환불", count: 412 },
  { label: "로그인·계정", count: 268 },
  { label: "이용 방법", count: 175 },
  { label: "오류·버그", count: 96 },
  { label: "기타", count: 49 }
];
const WEEK_DATA = [
  { week: "W1", count: 118, hours: 9.8,  repeatRate: 14.0 },
  { week: "W2", count: 125, hours: 9.5,  repeatRate: 13.5 },
  { week: "W3", count: 131, hours: 10.4, repeatRate: 14.8 },
  { week: "W4", count: 140, hours: 11.2, repeatRate: 15.2 },
  { week: "W5", count: 129, hours: 9.1,  repeatRate: 12.1 },
  { week: "W6", count: 122, hours: 8.2,  repeatRate: 10.9 },
  { week: "W7", count: 121, hours: 7.6,  repeatRate: 9.8 },
  { week: "W8", count: 114, hours: 7.1,  repeatRate: 9.2 }
];

// ===== 유틸 =====
const SVG_NS = "http://www.w3.org/2000/svg";
function svgEl(tagName, attrs, text) {
  const node = document.createElementNS(SVG_NS, tagName);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  if (text !== undefined) node.textContent = text;
  return node;
}
const fmtInt = (n) => n.toLocaleString("ko-KR");
const fmt1 = (n) => n.toFixed(1);
function changeText(diff, unit) {
  const sign = diff < 0 ? "줄었습니다" : diff > 0 ? "늘었습니다" : "변동 없음";
  return diff === 0 ? sign : `<b>${fmt1(Math.abs(diff))}${unit}</b> ${sign}`;
}

// ===== 계산 =====
const totalCount = WEEK_DATA.reduce((sum, w) => sum + w.count, 0);
const firstWeek = WEEK_DATA[0];
const lastWeek = WEEK_DATA[WEEK_DATA.length - 1];
const peakWeek = WEEK_DATA.reduce((best, w) => (w.hours > best.hours ? w : best), WEEK_DATA[0]);
const sortedTypes = TYPE_DATA.slice().sort((a, b) => b.count - a.count);
const typeTotal = TYPE_DATA.reduce((sum, t) => sum + t.count, 0);
const topTwoShare = Math.round(((sortedTypes[0].count + sortedTypes[1].count) / typeTotal) * 100);
const weekNo = (w) => w.week.replace(/\D/g, "");

// ===== KPI =====
function renderKpis() {
  const hoursDiff = lastWeek.hours - firstWeek.hours;
  const rateDiff = lastWeek.repeatRate - firstWeek.repeatRate;
  const items = [
    { label: "총 문의 건수 (8주)", value: fmtInt(totalCount), unit: "건", delta: `${WEEK_DATA.length}주 합계` },
    { label: "최근 주 평균 처리시간", value: fmt1(lastWeek.hours), unit: "시간",
      delta: `${firstWeek.week} 대비 ${changeText(hoursDiff, "시간")}` },
    { label: "최근 주 재문의율", value: fmt1(lastWeek.repeatRate), unit: "%",
      delta: `${firstWeek.week} 대비 ${changeText(rateDiff, "%p")}` }
  ];
  document.getElementById("kpis").innerHTML = items.map((it) => `
    <div class="card">
      <div class="kpi-label">${it.label}</div>
      <div class="kpi-value">${it.value}<small>${it.unit}</small></div>
      <div class="kpi-delta">${it.delta}</div>
    </div>`).join("");
}

// ===== 차트 1: 문의 유형별 가로 막대 =====
function renderTypeChart() {
  const svg = document.getElementById("chart-types");
  svg.innerHTML = "";
  const labelW = 82, barMax = 250, rowH = 40, padY = 8, barH = 24;
  const maxCount = sortedTypes[0].count;
  sortedTypes.forEach((t, i) => {
    const y = padY + i * rowH;
    const w = Math.max(2, (t.count / maxCount) * barMax);
    const pct = ((t.count / typeTotal) * 100).toFixed(1);
    svg.appendChild(svgEl("text", { x: labelW - 8, y: y + barH / 2 + 5, "text-anchor": "end", "font-size": 13 }, t.label));
    svg.appendChild(svgEl("rect", { x: labelW, y, width: w, height: barH, rx: 4, class: i < 2 ? "bar-strong" : "bar-soft" }));
    svg.appendChild(svgEl("text", { x: labelW + w + 8, y: y + barH / 2 + 5, "font-size": 13, "font-weight": i < 2 ? 700 : 400 },
      `${fmtInt(t.count)}건 (${pct}%)`));
  });
}

// ===== 차트 2: 주차별 평균 처리시간 꺾은선 =====
function renderTimeChart() {
  const svg = document.getElementById("chart-time");
  svg.innerHTML = "";
  const W = 480, H = 230;
  const pad = { l: 34, r: 20, t: 28, b: 32 };
  const values = WEEK_DATA.map((w) => w.hours);
  const yMin = Math.floor(Math.min(...values) / 2) * 2 - 2 < 0 ? 0 : Math.floor(Math.min(...values) / 2) * 2;
  const yMax = Math.ceil(Math.max(...values) / 2) * 2 + (Math.max(...values) % 2 === 0 ? 2 : 0);
  const xAt = (i) => pad.l + (i / (WEEK_DATA.length - 1)) * (W - pad.l - pad.r);
  const yAt = (v) => pad.t + (1 - (v - yMin) / (yMax - yMin)) * (H - pad.t - pad.b);

  for (let tick = yMin; tick <= yMax; tick += 2) {
    svg.appendChild(svgEl("line", { x1: pad.l, x2: W - pad.r, y1: yAt(tick), y2: yAt(tick), class: "grid-line" }));
    svg.appendChild(svgEl("text", { x: pad.l - 6, y: yAt(tick) + 4, "text-anchor": "end", "font-size": 11, class: "t-sub" }, tick));
  }
  const pts = WEEK_DATA.map((w, i) => `${xAt(i).toFixed(1)},${yAt(w.hours).toFixed(1)}`).join(" ");
  svg.appendChild(svgEl("polyline", { points: pts, class: "line" }));

  WEEK_DATA.forEach((w, i) => {
    const isKey = w === peakWeek || w === lastWeek;
    svg.appendChild(svgEl("circle", { cx: xAt(i), cy: yAt(w.hours), r: isKey ? 7 : 4, class: isKey ? "dot-big" : "dot" }));
    svg.appendChild(svgEl("text", { x: xAt(i), y: yAt(w.hours) - (isKey ? 13 : 10), "text-anchor": "middle",
      "font-size": 12, "font-weight": isKey ? 700 : 400 }, fmt1(w.hours)));
    svg.appendChild(svgEl("text", { x: xAt(i), y: H - 10, "text-anchor": "middle", "font-size": 12,
      class: "t-sub", "font-weight": isKey ? 700 : 400 }, w.week));
  });
}

// ===== 인사이트 =====
function renderInsight() {
  const diff = peakWeek.hours - lastWeek.hours;
  const verb = diff > 0 ? "줄었다" : diff < 0 ? "늘었다" : "같았다";
  const text = `${sortedTypes[0].label}과 ${sortedTypes[1].label}이 전체 문의의 ${topTwoShare}%를 차지하고, ` +
    `처리시간은 ${weekNo(peakWeek)}주차 ${fmt1(peakWeek.hours)}시간에서 ${weekNo(lastWeek)}주차 ${fmt1(lastWeek.hours)}시간으로 ${verb}` +
    (diff === 0 ? "." : ` (${fmt1(Math.abs(diff))}시간).`);
  document.getElementById("insight").textContent = text;
}

renderKpis();
renderTypeChart();
renderTimeChart();
renderInsight();
</script>
</body>
</html>
